services:
  # ── Backend Express API + Socket.IO Server ──────────────────────────────
  - type: web
    name: tandem-backend
    env: node
    rootDir: tandem-backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard
      - key: GEMINI_API_KEY
        sync: false # Set your Google Gemini API Key in Render Dashboard
      - key: JWT_SECRET
        generateValue: true

  # ── Frontend React + Vite SPA ───────────────────────────────────────────
  - type: web
    name: tandem-frontend
    env: static
    rootDir: tandem-frontend-source
    buildCommand: npm install --no-frozen-lockfile && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tandem-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
